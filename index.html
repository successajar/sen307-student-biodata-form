
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Biodata Form | SEN 307 Group 8</title>


    <!-- Stylesheets will be implemented by CSS team members -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/responsive.css">


    <!-- Validation scripts will be implemented by JS team members -->
    <script src="js/required.js" defer></script>
    <script src="js/formats.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Student Biodata Form</h1>
        <p>Please fill in your information below.</p>
    </header>


    <main>
        <form id="biodata-form" novalidate>


            <!-- Personal information fields -->
            <fieldset id="personal-info">
                <legend>Personal Information</legend>
            </fieldset>

            <!-- Contact information fields -->
            <fieldset id="contact-info">
                <legend>Contact Information</legend>
            </fieldset>

            <!-- Academic information fields -->
            <fieldset id="academic-info">
                <legend>Academic Information</legend>

                <div class="form-group">
                    <label for="matric-number">Matriculation Number:</label>
                    <input type="text" id="matric-number" name="matricNumber"
                           placeholder="Enter your matric number" required>
                    <small class="error-message" id="matric-number-error"></small>
                </div>

                <div class="form-group">
                    <label for="department">Department:</label>
                    <input type="text" id="department" name="department"
                           placeholder="e.g. Software Engineering" required>
                    <small class="error-message" id="department-error"></small>
                </div>

                <div class="form-group">
                    <label for="faculty">Faculty:</label>
                    <input type="text" id="faculty" name="faculty"
                           placeholder="Enter your faculty" required>
                    <small class="error-message" id="faculty-error"></small>
                </div>

                <div class="form-group">
                    <label for="level">Current Level:</label>
                    <select id="level" name="level" required>
                        <option value="">Select level</option>
                        <option value="100">100 Level</option>
                        <option value="200">200 Level</option>
                        <option value="300">300 Level</option>
                        <option value="400">400 Level</option>
                        <option value="500">500 Level</option>
                    </select>
                    <small class="error-message" id="level-error"></small>
                </div>

                <div class="form-group">
                    <label for="programme">Programme of Study:</label>
                    <input type="text" id="programme" name="programme"
                           placeholder="Enter your programme" required>
                    <small class="error-message" id="programme-error"></small>
                </div>

                <div class="form-group">
                    <label for="entry-year">Year of Admission:</label>
                    <input type="number" id="entry-year" name="entryYear"
                           placeholder="e.g. 2023" min="2000" max="2026" required>
                    <small class="error-message" id="entry-year-error"></small>
                </div>

                <div class="form-group">
                    <label for="institution">Institution:</label>
                    <input type="text" id="institution" name="institution"
                           placeholder="Enter your institution's name" required>
                    <small class="error-message" id="institution-error"></small>
                </div>
            </fieldset>


            <!-- Submission handling -->
            <button type="submit" id="submit-button" disabled>
                Submit Biodata
            </button>

            <p id="form-status" aria-live="polite"></p>

        </form>
    </main>

</body>
</html>
