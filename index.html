<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Biodata Form | SEN 307 Group 8</title>

    <!-- CSS belongs to the group's CSS contributors. -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Plain JavaScript: order matters because app.js calls both validators. -->
    <script src="js/required.js" defer></script>
    <script src="js/formats.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>Student Biodata Form</h1>
        <p>Please fill in the required information below.</p>
    </header>

    <main>
        <form id="biodata-form" novalidate>
            <fieldset id="personal-info">
                <legend>Personal Information</legend>

                <div class="form-group">
                    <label for="first-name">First Name:</label>
                    <input type="text" id="first-name" name="firstName"
                           autocomplete="given-name" placeholder="Enter your first name" required>
                    <small class="error-message" id="first-name-error"></small>
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name:</label>
                    <input type="text" id="last-name" name="lastName"
                           autocomplete="family-name" placeholder="Enter your last name" required>
                    <small class="error-message" id="last-name-error"></small>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dateOfBirth" required>
                    <small class="error-message" id="dob-error"></small>
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                    <small class="error-message" id="gender-error"></small>
                </div>
            </fieldset>

            <fieldset id="contact-info">
                <legend>Contact Information</legend>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" autocomplete="email"
                           placeholder="student@example.com" required>
                    <small class="error-message" id="email-error"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel"
                           placeholder="e.g. 08012345678" required>
                    <small class="error-message" id="phone-error"></small>
                </div>

                <div class="form-group">
                    <label for="state-of-origin">State of Origin:</label>
                    <input type="text" id="state-of-origin" name="stateOfOrigin"
                           placeholder="Enter your state of origin" required>
                    <small class="error-message" id="state-of-origin-error"></small>
                </div>
            </fieldset>

            <!-- Academic Information: preserved from Regina's merged PR #12. -->
            <fieldset id="academic-info">
                <legend>Academic Information</legend>

                <div class="form-group">
                    <label for="matric-number">Matriculation Number:</label>
                    <input type="text" id="matric-number" name="matricNumber"
                           placeholder="Enter your matric number" required>
                    <small class="error-message" id="matric-number-error"></small>
                </div>

                <div class="form-group">
                    <label for="department">Department:</label>
                    <input type="text" id="department" name="department"
                           placeholder="e.g. Software Engineering" required>
                    <small class="error-message" id="department-error"></small>
                </div>

                <div class="form-group">
                    <label for="faculty">Faculty:</label>
                    <input type="text" id="faculty" name="faculty"
                           placeholder="Enter your faculty" required>
                    <small class="error-message" id="faculty-error"></small>
                </div>

                <div class="form-group">
                    <label for="level">Current Level:</label>
                    <select id="level" name="level" required>
                        <option value="">Select level</option>
                        <option value="100">100 Level</option>
                        <option value="200">200 Level</option>
                        <option value="300">300 Level</option>
                        <option value="400">400 Level</option>
                        <option value="500">500 Level</option>
                    </select>
                    <small class="error-message" id="level-error"></small>
                </div>

                <div class="form-group">
                    <label for="programme">Programme of Study:</label>
                    <input type="text" id="programme" name="programme"
                           placeholder="Enter your programme" required>
                    <small class="error-message" id="programme-error"></small>
                </div>

                <div class="form-group">
                    <label for="entry-year">Year of Admission:</label>
                    <input type="number" id="entry-year" name="entryYear"
                           placeholder="e.g. 2023" min="2000" required>
                    <small class="error-message" id="entry-year-error"></small>
                </div>

                <div class="form-group">
                    <label for="institution">Institution:</label>
                    <input type="text" id="institution" name="institution"
                           placeholder="Enter your institution's name" required>
                    <small class="error-message" id="institution-error"></small>
                </div>
            </fieldset>

            <!-- JS enables the button after all validation scripts have loaded. -->
            <button type="submit" id="submit-button" disabled>Submit Biodata</button>
            <p id="form-status" aria-live="polite" role="status"></p>
        </form>
    </main>
</body>
</html>
